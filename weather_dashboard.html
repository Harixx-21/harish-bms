<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --primary: #3498db;
            --secondary: #2c3e50;
            --accent: #e74c3c;
            --success: #27ae60;
            --bg: #ecf0f1;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --shadow: 0 4px 20px rgba(0,0,0,0.1);
            --radius: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .search-section {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .search-section input {
            padding: 12px 20px;
            border: none;
            border-radius: var(--radius);
            width: 300px;
            font-size: 1em;
            box-shadow: var(--shadow);
        }

        .search-section button {
            padding: 12px 30px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: var(--radius);
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .search-section button:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: all 0.3s;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--bg);
            padding-bottom: 15px;
        }

        .location-name {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text);
        }

        .location-meta {
            font-size: 0.9em;
            color: var(--text-light);
        }

        .current-weather {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 20px;
        }

        .weather-icon {
            font-size: 4em;
            text-align: center;
            flex-shrink: 0;
        }

        .weather-info {
            flex: 1;
        }

        .temperature {
            font-size: 2.5em;
            font-weight: 800;
            color: var(--primary);
        }

        .weather-desc {
            font-size: 1.1em;
            color: var(--text-light);
            margin-top: 5px;
        }

        .weather-details {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 15px;
            margin-bottom: 20px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: var(--text-light);
            font-weight: 500;
        }

        .detail-value {
            color: var(--text);
            font-weight: 700;
        }

        .hourly-forecast {
            margin-top: 20px;
        }

        .forecast-title {
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 15px;
        }

        .hourly-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
        }

        .hourly-item {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 10px;
            text-align: center;
            transition: all 0.3s;
        }

        .hourly-item:hover {
            background: var(--primary);
            color: white;
        }

        .hourly-time {
            font-size: 0.85em;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .hourly-icon {
            font-size: 2em;
            margin-bottom: 5px;
        }

        .hourly-temp {
            font-size: 0.95em;
            font-weight: 700;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            background: var(--accent);
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            font-weight: 600;
        }

        .success {
            background: var(--success);
            color: white;
            padding: 15px 20px;
            border-radius: var(--radius);
            margin-bottom: 20px;
        }

        .daily-forecast {
            margin-top: 30px;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
        }

        .daily-title {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 20px;
        }

        .daily-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .daily-item {
            background: var(--bg);
            border-radius: var(--radius);
            padding: 15px;
            text-align: center;
        }

        .daily-date {
            font-weight: 700;
            color: var(--text);
            margin-bottom: 10px;
        }

        .daily-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .daily-temps {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
        }

        .daily-max {
            color: var(--accent);
            font-weight: 700;
        }

        .daily-min {
            color: var(--primary);
            font-weight: 700;
        }

        .daily-rain {
            font-size: 0.9em;
            color: var(--text-light);
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 2em;
            }

            .search-section {
                flex-direction: column;
            }

            .search-section input {
                width: 100%;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .current-weather {
                flex-direction: column;
                text-align: center;
            }
        }

        .favorites {
            margin-bottom: 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .fav-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 600;
        }

        .fav-btn:hover {
            background: white;
            color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌤️ Weather Dashboard</h1>
            <p>Real-time weather information powered by Open-Meteo API</p>
        </div>

        <div class="search-section">
            <input type="text" id="locationInput" placeholder="Enter city name (e.g., London, New York, Tokyo)...">
            <button onclick="searchWeather()">Search</button>
        </div>

        <div class="favorites">
            <button class="fav-btn" onclick="searchByCoordinates(28.6139, 77.2090)">🇮🇳 Delhi</button>
            <button class="fav-btn" onclick="searchByCoordinates(19.0760, 72.8777)">Mumbai</button>
            <button class="fav-btn" onclick="searchByCoordinates(13.0827, 80.2707)">Chennai</button>
            <button class="fav-btn" onclick="searchByCoordinates(51.5074, -0.1278)">🇬🇧 London</button>
            <button class="fav-btn" onclick="searchByCoordinates(40.7128, -74.0060)">🇺🇸 New York</button>
        </div>

        <div id="alertContainer"></div>
        <div id="weatherContainer"></div>
        <div id="dailyContainer"></div>
    </div>

    <script>
        const GEOCODING_API = 'https://geocoding-api.open-meteo.com/v1/search';
        const WEATHER_API = 'https://api.open-meteo.com/v1/forecast';

        async function searchWeather() {
            const location = document.getElementById('locationInput').value.trim();
            if (!location) {
                showAlert('Please enter a location', 'error');
                return;
            }

            showLoading();

            try {
                // First, geocode the location
                const geoResponse = await fetch(
                    `${GEOCODING_API}?name=${encodeURIComponent(location)}&count=1&language=en&format=json`
                );
                const geoData = await geoResponse.json();

                if (!geoData.results || geoData.results.length === 0) {
                    showAlert('Location not found. Please try another city name.', 'error');
                    return;
                }

                const place = geoData.results[0];
                await fetchWeather(place.latitude, place.longitude, place.name, place.country);

            } catch (error) {
                console.error('Error:', error);
                showAlert('Failed to fetch weather data. Please try again.', 'error');
            }
        }

        async function searchByCoordinates(lat, lon) {
            showLoading();
            try {
                await fetchWeather(lat, lon);
            } catch (error) {
                showAlert('Failed to fetch weather data.', 'error');
            }
        }

        async function fetchWeather(latitude, longitude, name = 'Location', country = '') {
            try {
                const weatherResponse = await fetch(
                    `${WEATHER_API}?latitude=${latitude}&longitude=${longitude}` +
                    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
                    `&hourly=temperature_2m,weather_code` +
                    `&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max` +
                    `&temperature_unit=celsius&wind_speed_unit=kmh&precipitation_unit=mm&timezone=auto`
                );

                const data = await weatherResponse.json();
                renderWeather(data, name, country);

            } catch (error) {
                console.error('Error fetching weather:', error);
                showAlert('Error fetching weather data.', 'error');
            }
        }

        function renderWeather(data, name, country) {
            const current = data.current;
            const hourly = data.hourly;
            const daily = data.daily;
            const weatherCode = current.weather_code;
            const weatherDesc = getWeatherDescription(weatherCode);
            const weatherIcon = getWeatherIcon(weatherCode);

            const html = `
                <div class="weather-grid">
                    <div class="weather-card">
                        <div class="weather-header">
                            <div>
                                <div class="location-name">${name}</div>
                                <div class="location-meta">${country || 'Weather Info'}</div>
                            </div>
                            <div class="weather-icon">${weatherIcon}</div>
                        </div>

                        <div class="current-weather">
                            <div class="weather-info">
                                <div class="temperature">${Math.round(current.temperature_2m)}°C</div>
                                <div class="weather-desc">${weatherDesc}</div>
                                <div class="weather-desc">Feels like ${Math.round(current.apparent_temperature)}°C</div>
                            </div>
                        </div>

                        <div class="weather-details">
                            <div class="detail-row">
                                <span class="detail-label">💧 Humidity</span>
                                <span class="detail-value">${current.relative_humidity_2m}%</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">💨 Wind Speed</span>
                                <span class="detail-value">${current.wind_speed_10m} km/h</span>
                            </div>
                            <div class="detail-row">
                                <span class="detail-label">🌡️ Temperature</span>
                                <span class="detail-value">${current.temperature_2m}°C</span>
                            </div>
                        </div>

                        <div class="hourly-forecast">
                            <div class="forecast-title">Next 12 Hours</div>
                            <div class="hourly-grid">
                                ${renderHourlyForecast(hourly)}
                            </div>
                        </div>
                    </div>
                </div>

                <div class="daily-forecast">
                    <div class="daily-title">📅 7-Day Forecast</div>
                    <div class="daily-grid">
                        ${renderDailyForecast(daily)}
                    </div>
                </div>
            `;

            document.getElementById('weatherContainer').innerHTML = html;
            document.getElementById('dailyContainer').innerHTML = '';
        }

        function renderHourlyForecast(hourly) {
            const now = new Date();
            let html = '';

            for (let i = 0; i < 12; i++) {
                const time = new Date(now.getTime() + i * 60 * 60 * 1000);
                const hours = time.getHours();
                const timeStr = `${String(hours).padStart(2, '0')}:00`;
                const temp = hourly.temperature_2m[i];
                const code = hourly.weather_code[i];

                html += `
                    <div class="hourly-item">
                        <div class="hourly-time">${timeStr}</div>
                        <div class="hourly-icon">${getWeatherIcon(code)}</div>
                        <div class="hourly-temp">${Math.round(temp)}°</div>
                    </div>
                `;
            }

            return html;
        }

        function renderDailyForecast(daily) {
            let html = '';

            for (let i = 0; i < Math.min(7, daily.time.length); i++) {
                const date = new Date(daily.time[i]);
                const dateStr = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
                const code = daily.weather_code[i];
                const maxTemp = Math.round(daily.temperature_2m_max[i]);
                const minTemp = Math.round(daily.temperature_2m_min[i]);
                const rain = daily.precipitation_sum[i];

                html += `
                    <div class="daily-item">
                        <div class="daily-date">${dateStr}</div>
                        <div class="daily-icon">${getWeatherIcon(code)}</div>
                        <div class="daily-temps">
                            <span class="daily-max">${maxTemp}°</span>
                            <span class="daily-min">${minTemp}°</span>
                        </div>
                        <div class="daily-rain">💧 ${rain}mm</div>
                    </div>
                `;
            }

            return html;
        }

        function getWeatherIcon(code) {
            // WMO Weather interpretation codes
            if (code === 0) return '☀️';           // Clear sky
            if (code === 1 || code === 2) return '🌤️'; // Mainly clear
            if (code === 3) return '☁️';           // Overcast
            if (code === 45 || code === 48) return '🌫️'; // Foggy
            if (code === 51 || code === 53 || code === 55) return '🌧️'; // Drizzle
            if (code === 61 || code === 63 || code === 65) return '🌧️'; // Rain
            if (code === 71 || code === 73 || code === 75) return '❄️'; // Snow
            if (code === 77) return '❄️';         // Snow grains
            if (code === 80 || code === 81 || code === 82) return '🌧️'; // Rain showers
            if (code === 85 || code === 86) return '❄️'; // Snow showers
            if (code === 95 || code === 96 || code === 99) return '⛈️'; // Thunderstorm
            return '🌐';                            // Default
        }

        function getWeatherDescription(code) {
            const descriptions = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Foggy',
                48: 'Foggy with rime',
                51: 'Light drizzle',
                53: 'Moderate drizzle',
                55: 'Dense drizzle',
                61: 'Slight rain',
                63: 'Moderate rain',
                65: 'Heavy rain',
                71: 'Slight snow',
                73: 'Moderate snow',
                75: 'Heavy snow',
                77: 'Snow grains',
                80: 'Slight rain showers',
                81: 'Moderate rain showers',
                82: 'Violent rain showers',
                85: 'Slight snow showers',
                86: 'Heavy snow showers',
                95: 'Thunderstorm',
                96: 'Thunderstorm with light hail',
                99: 'Thunderstorm with heavy hail'
            };
            return descriptions[code] || 'Unknown weather';
        }

        function showLoading() {
            document.getElementById('weatherContainer').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Fetching weather data...</p>
                </div>
            `;
        }

        function showAlert(message, type) {
            const alertHtml = `<div class="${type}">${message}</div>`;
            const container = document.getElementById('alertContainer');
            container.innerHTML = alertHtml;

            setTimeout(() => {
                container.innerHTML = '';
            }, 4000);
        }

        // Allow Enter key to search
        document.getElementById('locationInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load default weather for Delhi on page load
        window.addEventListener('load', () => {
            searchByCoordinates(28.6139, 77.2090);
        });
    </script>
</body>
</html>
